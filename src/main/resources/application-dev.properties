# Dev Profile Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.show-sql=false

# Dev Seed Credentials (can be overridden via environment variables)
# Passwords will require change on first login as per security rules
app.seed.admin-password=${SEED_ADMIN_PASS:Admin@Pass1234}
app.seed.operator-password=${SEED_OPERATOR_PASS:Operator@Pass1234}
app.seed.viewer-password=${SEED_VIEWER_PASS:Viewer@Pass1234}
