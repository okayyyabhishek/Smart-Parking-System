<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive parking bay grid. Real-time slot status telemetry, active vehicle inspection, and direct bay release controls.">
    <meta name="color-scheme" content="light dark">
    <title>Parking Bays — Smart Parking Allocation System</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/portal-operator.css">

    <!-- Flash-free theme initialization -->
    <script type="module" src="/js/core/theme.js"></script>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div class="app-shell">
        <aside class="app-sidebar" id="operator-sidebar"></aside>

        <div class="app-main">
            <header class="app-topbar" id="operator-topbar"></header>

            <main class="content-body" id="main-content">
                <!-- Page Title -->
                <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:var(--space-4); margin-bottom:var(--space-6);">
                    <div>
                        <div style="display:flex; align-items:center; gap:var(--space-3); margin-bottom:var(--space-1);">
                            <h1>Parking Bays Manager</h1>
                            <span class="dsa-badge">Slot Search · Linear Search · O(n)</span>
                        </div>
                        <p class="text-muted" style="margin:0;">Interactive painted parking bay map and tabular directory.</p>
                    </div>

                    <!-- View Mode Toggle -->
                    <div style="display:flex; gap:var(--space-2); background:var(--surface-2); padding:3px; border-radius:var(--radius-sm); border:1px solid var(--border);">
                        <button type="button" id="view-grid-btn" class="btn btn-secondary btn-sm" style="background:var(--surface);">
                            <span>Grid Map</span>
                        </button>
                        <button type="button" id="view-table-btn" class="btn btn-secondary btn-sm" style="border-color:transparent;">
                            <span>Data Table</span>
                        </button>
                    </div>
                </div>

                <!-- Filter & Search Toolbar -->
                <div style="background-color:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:var(--space-4); margin-bottom:var(--space-6); display:flex; flex-wrap:wrap; gap:var(--space-4); align-items:center; justify-content:space-between;">
                    <div style="display:flex; flex-wrap:wrap; gap:var(--space-3); align-items:center; flex:1; min-width:0;">
                        <input type="text" id="slot-search-input" class="form-input toolbar-search" placeholder="Search bays or vehicles...">
                        
                        <select id="status-filter" class="form-select" aria-label="Filter by Status">
                            <option value="">All Statuses</option>
                            <option value="AVAILABLE">Available</option>
                            <option value="OCCUPIED">Occupied</option>
                            <option value="MAINTENANCE">Maintenance</option>
                        </select>

                        <select id="type-filter" class="form-select" aria-label="Filter by Type">
                            <option value="">All Bay Types</option>
                            <option value="NORMAL">NORMAL</option>
                            <option value="LARGE">LARGE</option>
                            <option value="EV">EV</option>
                            <option value="ACCESSIBLE">ACCESSIBLE</option>
                        </select>
                    </div>

                    <div id="slots-count-badge" class="dsa-badge" style="font-size:var(--text-xs);">
                        Showing 0 bays
                    </div>
                </div>

                <!-- Grid View Container -->
                <div id="slots-grid-view" class="slot-grid">
                    <div class="text-muted" style="padding:var(--space-4);">Loading bays...</div>
                </div>

                <!-- Table View Container (Initially Hidden) -->
                <div id="slots-table-view" style="display:none;"></div>
            </main>
        </div>
    </div>

    <!-- Page Script -->
    <script type="module">
        import { setupOperatorShell } from '/js/operator/operator-shell.js';
        import { api } from '/js/core/api.js';
        import { DataTable } from '/js/core/table.js';
        import { formatPlate, escapeHtml } from '/js/core/format.js';

        let allSlots = [];
        let activeView = 'grid'; // 'grid' | 'table'
        let dataTableInstance = null;

        async function init() {
            await setupOperatorShell('slots');
            setupViewToggle();
            setupFilters();
            await loadSlots();
        }

        async function loadSlots() {
            try {
                allSlots = await api.get('/api/operator/slots');
                renderCurrentView();
            } catch (err) {
                console.error('Failed to load slots', err);
            }
        }

        function getFilteredSlots() {
            const query = (document.getElementById('slot-search-input').value || '').trim().toLowerCase();
            const statusFilter = document.getElementById('status-filter').value;
            const typeFilter = document.getElementById('type-filter').value;

            return allSlots.filter(s => {
                if (statusFilter && s.status !== statusFilter) return false;
                if (typeFilter && s.slotType !== typeFilter) return false;
                if (query) {
                    const matchNum = s.slotNumber.toLowerCase().includes(query);
                    const matchZone = s.zone.toLowerCase().includes(query);
                    const matchPlate = s.currentVehicleNumber && s.currentVehicleNumber.toLowerCase().includes(query);
                    if (!matchNum && !matchZone && !matchPlate) return false;
                }
                return true;
            });
        }

        function renderCurrentView() {
            const filtered = getFilteredSlots();
            document.getElementById('slots-count-badge').textContent = `Showing ${filtered.length} of ${allSlots.length} bays`;

            if (activeView === 'grid') {
                renderGridView(filtered);
            } else {
                renderTableView(filtered);
            }
        }

        function renderGridView(slots) {
            const container = document.getElementById('slots-grid-view');
            if (!container) return;

            if (slots.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <h3 class="empty-state-title">No Matching Parking Bays</h3>
                        <p class="empty-state-text">Try modifying your search or filter options.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = slots.map(slot => {
                const isOccupied = slot.status === 'OCCUPIED';
                const isMaint = slot.status === 'MAINTENANCE';

                return `
                    <div class="slot-tile ${isMaint ? 'maintenance' : ''}">
                        <div class="slot-tile-header">
                            <span class="slot-id">${escapeHtml(slot.slotNumber)}</span>
                            <span class="slot-type-badge ${escapeHtml(slot.slotType)}">${escapeHtml(slot.slotType)}</span>
                        </div>

                        <div class="slot-tile-body">
                            ${isOccupied && slot.currentVehicleNumber ? `
                                <div style="margin-bottom:var(--space-1);">
                                    <span class="plate-tag">${escapeHtml(formatPlate(slot.currentVehicleNumber))}</span>
                                </div>
                                <div style="font-size:var(--text-xs); color:var(--text-muted);">${escapeHtml(slot.currentVehicleType || 'Vehicle')}</div>
                            ` : `
                                <div class="status-chip ${escapeHtml(slot.status)}">
                                    <span class="status-dot"></span>
                                    <span>${escapeHtml(slot.status)}</span>
                                </div>
                            `}
                        </div>

                        <div class="slot-tile-footer">
                            <span class="text-muted">Zone ${escapeHtml(slot.zone)} · F${escapeHtml(slot.floor)}</span>
                            ${isOccupied ? `
                                <button type="button" class="btn btn-secondary btn-sm" style="font-size:0.7rem; padding:0 6px; min-height:26px;" onclick="window.openExitModal('${escapeHtml(slot.currentVehicleNumber)}', () => window.location.reload())">
                                    Exit
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderTableView(slots) {
            const container = document.getElementById('slots-table-view');
            if (!container) return;

            if (!dataTableInstance) {
                dataTableInstance = new DataTable({
                    container,
                    caption: 'Parking Bay Directory',
                    dsaAnnotation: 'Slot Search · Linear Search · O(n)',
                    columns: [
                        { key: 'slotNumber', label: 'Slot #', sortable: true },
                        { 
                            key: 'slotType', 
                            label: 'Bay Type', 
                            sortable: true,
                            render: (val) => `<span class="slot-type-badge ${escapeHtml(val)}">${escapeHtml(val)}</span>`
                        },
                        { key: 'zone', label: 'Zone', sortable: true },
                        { key: 'floor', label: 'Floor', sortable: true },
                        { 
                            key: 'status', 
                            label: 'Status', 
                            sortable: true,
                            render: (val) => `
                                <span class="status-chip ${escapeHtml(val)}">
                                    <span class="status-dot"></span>
                                    <span>${escapeHtml(val)}</span>
                                </span>
                            `
                        },
                        { 
                            key: 'currentVehicleNumber', 
                            label: 'Occupant', 
                            sortable: true,
                            render: (val) => val ? `<span class="plate-tag" style="font-size:0.75rem;">${escapeHtml(formatPlate(val))}</span>` : '—'
                        },
                        {
                            key: 'actions',
                            label: 'Action',
                            render: (_, row) => row.status === 'OCCUPIED' && row.currentVehicleNumber 
                                ? `<button type="button" class="btn btn-secondary btn-sm" onclick="window.openExitModal('${escapeHtml(row.currentVehicleNumber)}', () => window.location.reload())">Exit</button>` 
                                : '—'
                        }
                    ]
                });
            }

            dataTableInstance.setData(slots);
        }

        function setupViewToggle() {
            const gridBtn = document.getElementById('view-grid-btn');
            const tableBtn = document.getElementById('view-table-btn');
            const gridContainer = document.getElementById('slots-grid-view');
            const tableContainer = document.getElementById('slots-table-view');

            gridBtn.addEventListener('click', () => {
                activeView = 'grid';
                gridBtn.style.background = 'var(--surface)';
                gridBtn.style.borderColor = 'var(--border)';
                tableBtn.style.background = 'transparent';
                tableBtn.style.borderColor = 'transparent';

                gridContainer.style.display = 'grid';
                tableContainer.style.display = 'none';
                renderCurrentView();
            });

            tableBtn.addEventListener('click', () => {
                activeView = 'table';
                tableBtn.style.background = 'var(--surface)';
                tableBtn.style.borderColor = 'var(--border)';
                gridBtn.style.background = 'transparent';
                gridBtn.style.borderColor = 'transparent';

                gridContainer.style.display = 'none';
                tableContainer.style.display = 'block';
                renderCurrentView();
            });
        }

        function setupFilters() {
            document.getElementById('slot-search-input').addEventListener('input', () => renderCurrentView());
            document.getElementById('status-filter').addEventListener('change', () => renderCurrentView());
            document.getElementById('type-filter').addEventListener('change', () => renderCurrentView());
        }

        init();
    </script>
</body>
</html>
