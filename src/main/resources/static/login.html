<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to Smart Parking Allocation System. Role-based access control for Super Admin, Gate Operator, and Public Viewer.">
    <meta name="color-scheme" content="dark light">
    <title>Sign In — Smart Parking Allocation System</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">

    <!-- Flash-free theme initialization -->
    <script type="module" src="/js/core/theme.js"></script>

    <style>
        /* ===================================================
           FULL-SCREEN BACKGROUND CANVAS
        =================================================== */
        *,
        *::before,
        *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
        }

        .login-layout {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* Background image — full viewport cover */
        .bg-photo {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: url('/css/login-bg.jpg');
            background-size: cover;
            background-position: center 30%;
            background-repeat: no-repeat;
            /* Very slow cinematic drift */
            animation: bgDrift 28s ease-in-out infinite alternate;
        }

        @keyframes bgDrift {
            from { background-position: center 28%; transform: scale(1.00); }
            to   { background-position: center 36%; transform: scale(1.04); }
        }

        /* Scrim — darkens right side more, keeps left legible */
        .bg-scrim {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: linear-gradient(
                105deg,
                rgba(0,0,0,0.82)  0%,
                rgba(0,0,0,0.55) 38%,
                rgba(0,0,0,0.20) 65%,
                rgba(0,0,0,0.10) 100%
            );
        }

        /* Subtle moving scanline shimmer on the whole bg */
        .bg-scrim::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(255,255,255,0.013) 2px,
                rgba(255,255,255,0.013) 4px
            );
            pointer-events: none;
        }

        /* ===================================================
           HEADER — SLIM TRANSPARENT TOPBAR
        =================================================== */
        .login-header-bar {
            position: relative;
            z-index: 20;
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.38);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        /* Logo lockup */
        .logo-lockup {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #fff;
        }

        .logo-badge {
            position: relative;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #F2B705 0%, #C98B00 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 0 20px rgba(242,183,5,0.55),
                0 4px 14px rgba(0,0,0,0.4);
            overflow: hidden;
            flex-shrink: 0;
        }

        /* Shimmer sweep on logo badge */
        .logo-badge::before {
            content: '';
            position: absolute;
            top: 0; left: -80%;
            width: 55%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
            transform: skewX(-20deg);
            animation: badgeShimmer 3.8s ease-in-out infinite;
        }

        @keyframes badgeShimmer {
            0%, 55% { left: -80%; }
            100%     { left: 160%; }
        }

        .logo-text-group { display: flex; flex-direction: column; line-height: 1.2; }
        .logo-name {
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.02em;
        }
        .logo-tagline {
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255,255,255,0.55);
            letter-spacing: 0.04em;
        }

        /* Theme toggle */
        #theme-toggle {
            color: rgba(255,255,255,0.75);
            border-color: rgba(255,255,255,0.2);
        }
        #theme-toggle:hover {
            color: #fff;
            background: rgba(255,255,255,0.12);
        }

        /* ===================================================
           MAIN — CENTERED VERTICALLY
        =================================================== */
        .login-main {
            flex: 1;
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            padding: 40px 40px;
        }

        /* ===================================================
           GLASS LOGIN CARD — left side like reference
        =================================================== */
        .glass-card {
            width: 100%;
            max-width: 400px;
            background: rgba(10, 12, 18, 0.72);
            backdrop-filter: blur(28px) saturate(1.6);
            -webkit-backdrop-filter: blur(28px) saturate(1.6);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 24px;
            padding: 40px 36px 36px;
            box-shadow:
                0 0 0 1px rgba(242,183,5,0.10),
                0 32px 64px -16px rgba(0,0,0,0.8),
                0 8px 24px -6px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.08);
            animation: cardSlideIn 0.7s cubic-bezier(0.16,1,0.3,1) both;
            position: relative;
            overflow: hidden;
        }

        @keyframes cardSlideIn {
            from { opacity: 0; transform: translateX(-40px) scale(0.97); }
            to   { opacity: 1; transform: translateX(0) scale(1); }
        }

        /* Glowing top border accent */
        .card-accent-top {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #F2B705, #8B5CF6, #06B6D4, #F2B705);
            background-size: 300% 100%;
            animation: accentFlow 4s linear infinite;
            border-radius: 24px 24px 0 0;
        }

        @keyframes accentFlow {
            0%   { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        /* Live indicator */
        .live-row {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 20px;
        }

        .live-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #10B981;
            box-shadow: 0 0 8px #10B981;
            animation: liveBlink 2.2s ease-in-out infinite;
        }

        @keyframes liveBlink {
            0%, 100% { box-shadow: 0 0 6px #10B981; transform: scale(1); }
            50%       { box-shadow: 0 0 16px #10B981, 0 0 26px rgba(16,185,129,0.4); transform: scale(1.3); }
        }

        .live-text {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #10B981;
        }

        /* Heading */
        .card-title {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 900;
            color: #ffffff;
            line-height: 1.1;
            letter-spacing: -0.03em;
            margin-bottom: 6px;
        }

        .card-title .accent {
            color: #F2B705;
        }

        .card-subtitle {
            font-size: var(--text-sm);
            color: rgba(255,255,255,0.48);
            margin-bottom: 26px;
            line-height: 1.5;
        }

        /* ===================================================
           FORM INPUTS — glass style
        =================================================== */
        .field-label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(255,255,255,0.45);
            margin-bottom: 6px;
        }

        .field-group { margin-bottom: 16px; }

        .field-wrap { position: relative; }

        .field-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.35);
            pointer-events: none;
            display: flex;
            transition: color 0.15s ease;
        }

        .field-wrap:focus-within .field-icon {
            color: #F2B705;
        }

        .field-input {
            width: 100%;
            height: 46px;
            padding: 0 42px 0 40px;
            background: rgba(255,255,255,0.08);
            border: 1.5px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            color: #ffffff;
            font-family: var(--font-body);
            font-size: var(--text-sm);
            outline: none;
            transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
        }

        .field-input::placeholder {
            color: rgba(255,255,255,0.28);
        }

        .field-input:focus {
            background: rgba(255,255,255,0.12);
            border-color: #F2B705;
            box-shadow: 0 0 0 3px rgba(242,183,5,0.22), 0 4px 16px rgba(0,0,0,0.25);
        }

        .password-toggle-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 34px; height: 34px;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: rgba(255,255,255,0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s ease, background 0.15s ease;
        }

        .password-toggle-btn:hover {
            color: #fff;
            background: rgba(255,255,255,0.1);
        }

        /* ===================================================
           SUBMIT BUTTON
        =================================================== */
        .btn-signin {
            position: relative;
            width: 100%;
            height: 48px;
            margin-top: 8px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #F2B705 0%, #C98B00 100%);
            color: #17191C;
            font-family: var(--font-display);
            font-size: var(--text-sm);
            font-weight: 900;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            overflow: hidden;
            box-shadow:
                0 0 20px rgba(242,183,5,0.35),
                0 6px 18px -4px rgba(0,0,0,0.45);
            transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
        }

        .btn-signin::before {
            content: '';
            position: absolute;
            top: 0; left: -65%;
            width: 45%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
            transform: skewX(-20deg);
            transition: left 0.55s ease;
        }

        .btn-signin:hover {
            transform: translateY(-3px);
            box-shadow:
                0 0 32px rgba(242,183,5,0.55),
                0 12px 28px -6px rgba(0,0,0,0.5);
            filter: brightness(1.06);
        }

        .btn-signin:hover::before { left: 140%; }
        .btn-signin:active { transform: translateY(-1px); }
        .btn-signin:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

        /* ===================================================
           ERROR BANNER
        =================================================== */
        #error-banner {
            display: none;
            padding: 11px 14px;
            margin-bottom: 16px;
            background: rgba(176, 55, 43, 0.25);
            border: 1.5px solid rgba(240, 103, 90, 0.6);
            border-radius: 10px;
            color: #F0675A;
            font-size: var(--text-sm);
            font-weight: 600;
            animation: shakeIn 0.4s ease;
        }

        @keyframes shakeIn {
            0%, 100% { transform: translateX(0); }
            20%, 60%  { transform: translateX(-6px); }
            40%, 80%  { transform: translateX(6px); }
        }

        /* ===================================================
           DEMO CHIPS
        =================================================== */
        .demo-section {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .demo-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .demo-label {
            font-family: var(--font-display);
            font-size: 0.68rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            color: rgba(255,255,255,0.38);
        }

        .demo-hint {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: #F2B705;
            font-weight: 700;
        }

        .demo-chips {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .demo-chip {
            padding: 9px 6px 11px;
            background: rgba(255,255,255,0.06);
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .demo-chip::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 3px;
            opacity: 0.8;
            transition: height 0.15s ease;
        }

        .demo-chip[data-user="admin"]::after     { background: #8B5CF6; }
        .demo-chip[data-user="operator"]::after  { background: #10B981; }
        .demo-chip[data-user="viewer"]::after    { background: #06B6D4; }

        .demo-chip:hover {
            background: rgba(255,255,255,0.11);
            border-color: rgba(242,183,5,0.45);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.35);
        }

        .demo-chip:hover::after { height: 4px; }
        .demo-chip:active { transform: translateY(-1px); }

        .chip-role {
            font-family: var(--font-display);
            font-size: 0.7rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: rgba(255,255,255,0.9);
            margin-bottom: 2px;
        }

        .chip-user {
            font-family: var(--font-mono);
            font-size: 0.62rem;
            color: rgba(255,255,255,0.42);
        }

        /* ===================================================
           CORNER INFO STRIP — bottom left of card (like ref)
        =================================================== */
        .card-bottom-strip {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.07);
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: rgba(255,255,255,0.28);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* ===================================================
           FLOATING AMBIENT ELEMENTS OVER BG
        =================================================== */
        .bg-badge {
            position: fixed;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(10,12,18,0.72);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 999px;
            padding: 9px 16px;
            color: #fff;
            pointer-events: none;
        }

        .badge-tr {
            top: 80px; right: 32px;
            animation: floatUD 5.5s ease-in-out infinite alternate;
        }

        .badge-br {
            bottom: 80px; right: 32px;
            border-radius: 16px;
            padding: 12px 18px;
            animation: floatDU 7s ease-in-out infinite alternate;
        }

        @keyframes floatUD {
            from { transform: translateY(0); }
            to   { transform: translateY(-14px); }
        }

        @keyframes floatDU {
            from { transform: translateY(0); }
            to   { transform: translateY(12px); }
        }

        .ping-wrap {
            position: relative;
            width: 10px; height: 10px;
            flex-shrink: 0;
        }

        .ping-dot {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: #10B981;
            box-shadow: 0 0 8px #10B981;
        }

        .ping-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1.5px solid #10B981;
            animation: pingOut 2s ease-out infinite;
        }

        @keyframes pingOut {
            0%   { transform: scale(0.7); opacity: 1; }
            100% { transform: scale(2.3); opacity: 0; }
        }

        .badge-icon {
            width: 30px; height: 30px;
            border-radius: 9px;
            background: rgba(242,183,5,0.2);
            color: #F2B705;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .badge-text-group { display: flex; flex-direction: column; gap: 1px; }
        .badge-t { font-family: var(--font-display); font-size: 0.8rem; font-weight: 800; color: #fff; }
        .badge-s { font-family: var(--font-mono); font-size: 0.62rem; color: rgba(255,255,255,0.55); }

        /* ===================================================
           FOOTER
        =================================================== */
        .login-footer {
            position: relative;
            z-index: 20;
            padding: 12px var(--space-6);
            text-align: center;
            font-size: var(--text-xs);
            color: rgba(255,255,255,0.38);
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .login-footer a { color: rgba(255,255,255,0.5); }
        .login-footer a:hover { color: #F2B705; }

        /* ===================================================
           RESPONSIVE
        =================================================== */
        @media (max-width: 680px) {
            .login-main { padding: 24px 16px; }
            .glass-card { padding: 32px 22px 28px; max-width: 100%; }
            .card-title { font-size: 1.7rem; }
            .bg-badge { display: none; }
            .bgDrift { animation: none; }
        }
    </style>
</head>
<body class="login-layout">
    <a href="#login-form" class="skip-link">Skip to login form</a>

    <!-- Full-bleed background photo -->
    <div class="bg-photo" aria-hidden="true"></div>
    <div class="bg-scrim" aria-hidden="true"></div>


    <!-- ===================================================
         HEADER
    =================================================== -->
    <header class="login-header-bar">
        <!-- Logo lockup -->
        <a href="/login.html" class="logo-lockup" title="Smart Parking Allocation System">
            <div class="logo-badge">
                <svg width="22" height="22" viewBox="0 0 64 64" fill="none" style="position:relative;z-index:1">
                    <path d="M18 52V12H36C44.84 12 51 17.5 51 26.5C51 35.5 44.84 41 36 41H27V52H18ZM27 33H35.2C39.8 33 42.5 30.7 42.5 26.5C42.5 22.3 39.8 20 35.2 20H27V33Z" fill="#17191C"/>
                </svg>
            </div>
            <div class="logo-text-group">
                <span class="logo-name">Smart Parking</span>
                <span class="logo-tagline">Allocation System · 3-Tier Gateway</span>
            </div>
        </a>

        <!-- Theme toggle -->
        <button type="button" id="theme-toggle" class="btn-icon" aria-label="Toggle daylight or night theme" aria-pressed="false" title="Switch daylight/night mode">
            <span class="theme-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle></svg>
            </span>
        </button>
    </header>

    <!-- ===================================================
         MAIN — GLASS CARD ANCHORED LEFT
    =================================================== -->
    <main class="login-main">
        <div class="glass-card" id="login-card">
            <div class="card-accent-top" aria-hidden="true"></div>

            <!-- Heading -->
            <h1 class="card-title">Log <span class="accent">in</span></h1>
            <p class="card-subtitle">Enter credentials to access your workspace.</p>

            <!-- Error Banner -->
            <div id="error-banner" role="alert" aria-live="polite"></div>

            <!-- Form -->
            <form id="login-form" novalidate>
                <div class="field-group">
                    <label for="username" class="field-label">Username</label>
                    <div class="field-wrap">
                        <span class="field-icon" aria-hidden="true">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                            </svg>
                        </span>
                        <input type="text" id="username" name="username" class="field-input" placeholder="Enter your username" required autocomplete="username" autofocus>
                    </div>
                </div>

                <div class="field-group">
                    <label for="password" class="field-label">Password</label>
                    <div class="field-wrap">
                        <span class="field-icon" aria-hidden="true">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                        </span>
                        <input type="password" id="password" name="password" class="field-input" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" id="toggle-password-btn" class="password-toggle-btn" aria-label="Show password" title="Show password">
                            <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="btn-signin">
                    <span>Log in</span>
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
                    </svg>
                </button>
            </form>

            <!-- Demo credentials -->
            <div class="demo-section">
                <div class="demo-header-row">
                    <span class="demo-label">Demo Accounts</span>
                    <span class="demo-hint">↓ Click to fill</span>
                </div>
                <div class="demo-chips">
                    <button type="button" class="demo-chip" data-user="admin" data-pass="Admin@Pass1234" title="Super Admin">
                        <div class="chip-role">Admin</div>
                        <div class="chip-user">admin</div>
                    </button>
                    <button type="button" class="demo-chip" data-user="operator" data-pass="Operator@Pass1234" title="Operator">
                        <div class="chip-role">Operator</div>
                        <div class="chip-user">operator</div>
                    </button>
                    <button type="button" class="demo-chip" data-user="viewer" data-pass="Viewer@Pass1234" title="Viewer">
                        <div class="chip-role">Viewer</div>

    <!-- ===================================================
         SCRIPTS
    =================================================== -->
    <script type="module">
        import { login, getPortalHome } from '/js/core/auth.js';
        import { toast } from '/js/core/toast.js';

        const loginForm     = document.getElementById('login-form');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const toggleBtn     = document.getElementById('toggle-password-btn');
        const submitBtn     = document.getElementById('submit-btn');
        const errorBanner   = document.getElementById('error-banner');

        // Password toggle
        let showPw = false;
        toggleBtn.addEventListener('click', () => {
            showPw = !showPw;
            passwordInput.type = showPw ? 'text' : 'password';
            toggleBtn.setAttribute('aria-label', showPw ? 'Hide password' : 'Show password');
            toggleBtn.innerHTML = showPw
                ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
                : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
        });

        // Demo chip quick-fill
        document.querySelectorAll('.demo-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                usernameInput.value = chip.dataset.user;
                passwordInput.value = chip.dataset.pass;
                errorBanner.style.display = 'none';

                [usernameInput, passwordInput].forEach(inp => {
                    inp.style.transition = 'border-color 0.2s, box-shadow 0.2s';
                    inp.style.borderColor = '#F2B705';
                    inp.style.boxShadow = '0 0 0 3px rgba(242,183,5,0.28)';
                    setTimeout(() => { inp.style.borderColor = ''; inp.style.boxShadow = ''; }, 420);
                });

                usernameInput.focus();
            });
        });

        // Session-expiry banner
        if (new URLSearchParams(window.location.search).get('expired') === 'true') {
            showError('Your session has expired due to inactivity. Please sign in again.');
        }

        // Form submit
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBanner.style.display = 'none';

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showError('Please enter both username and password.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span>Authenticating...</span>`;

            try {
                const res = await login(username, password);
                toast.success(`Welcome back, ${res.username}!`, 'Signed In');

                const params = new URLSearchParams(window.location.search);
                const requestedRedirect = params.get('redirect');
                let targetUrl = getPortalHome(res.role);

                if (requestedRedirect && requestedRedirect.startsWith('/') && !requestedRedirect.startsWith('//')) {
                    if (res.role === 'SUPER_ADMIN') {
                        targetUrl = requestedRedirect;
                    } else if (res.role === 'OPERATOR' && (requestedRedirect.startsWith('/operator') || requestedRedirect.startsWith('/viewer'))) {
                        targetUrl = requestedRedirect;
                    } else if (res.role === 'VIEWER' && requestedRedirect.startsWith('/viewer')) {
                        targetUrl = requestedRedirect;
                    }
                }

                setTimeout(() => { window.location.href = targetUrl; }, 300);

            } catch (err) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `
                    <span>Log in</span>
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
                    </svg>`;

                let msg = 'Authentication failed. Please try again.';
                if (err.status === 423)      msg = err.message || 'Account locked. Try again in 5 minutes.';
                else if (err.status === 401)  msg = 'Invalid username or password. Please verify credentials.';
                else if (err.message)         msg = err.message;

                showError(msg);
                toast.error(msg, 'Authentication Failed');
            }
        });

        function showError(msg) {
            errorBanner.textContent = msg;
            errorBanner.style.display = 'block';
        }
    </script>
    <script type="module" src="/js/core/cookie-banner.js"></script>
