# Server configuration
server.port=8080
server.servlet.context-path=/
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Spring profile
spring.profiles.active=dev

# H2 File Database (Hardened Default)
spring.datasource.url=jdbc:h2:file:./data/parkingdb;AUTO_SERVER=FALSE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# H2 Console (disabled by default for security)
spring.h2.console.enabled=false

# Application Domain Properties
app.timezone=Asia/Kolkata
app.operator.history-days=7
app.recent-exits.capacity=50
app.security.max-login-attempts=5
app.security.lockout-minutes=5
