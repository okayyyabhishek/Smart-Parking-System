# In-memory H2 database for isolated, repeatable testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# App Properties
app.timezone=Asia/Kolkata
app.operator.history-days=7
app.recent-exits.capacity=50
app.security.max-login-attempts=5
app.security.lockout-minutes=5

# Seed credentials
app.seed.admin-password=Admin@Pass1234
app.seed.operator-password=Operator@Pass1234
app.seed.viewer-password=Viewer@Pass1234
